[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gestor-requerimientos-backend"
version = "0.1.0"
description = "Backend del Sistema de Especificacion de Requerimientos de Software"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "oracledb>=2.5",
    "docxtpl>=0.19",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers>=4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
# SIM300 (Yoda) produce falsos positivos con la comparacion idiomatica de SQLAlchemy
# (`column == valor`), que es la que mypy --strict acepta.
ignore = ["SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["alembic.*", "testcontainers.*", "docxtpl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -m \"not integration\""
markers = [
    "integration: pruebas que requieren Docker u Oracle",
]
