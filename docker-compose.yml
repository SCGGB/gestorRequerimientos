name: gestor-requerimientos

services:
  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-change_me}
      APP_USER: ${ORACLE_USER:-app_req}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change_me}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Object store S3 de desarrollo (solo con: docker compose --profile objectstore up).
  # Ver doc/architecture/adr/006-almacenamiento-objetos-dev.md.
  rustfs:
    image: rustfs/rustfs:1.0.0
    profiles: ["objectstore"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        ["CMD-SHELL",
         "curl -fsS http://localhost:9000/minio/health/ready || curl -fsS http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ORACLE_DSN: oracle:1521/FREEPDB1
      AI_PROVIDER: ${AI_PROVIDER:-none}
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_BACKEND_URL: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  oracle-data:
  rustfs-data:
